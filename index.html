<title>MAC Pizza Training — How to Close the Business Day in POS</title>
<style>
  :root { --navy: #1F3864; --bg: #f5f6f8; --text: #1a1a1a; --muted: #5a6270; --line: #dde1e8; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  header .brand { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; white-space: nowrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  main { flex: 1; position: relative; }
  main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  footer { background: #fff; border-top: 1px solid var(--line); padding: 8px 18px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  footer strong { color: var(--text); }
  footer a { color: var(--navy); }
</style>
</head>
